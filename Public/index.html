<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Modul & Berkas Lab Fisdas</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        navy: {
                            DEFAULT: '#1e5395',
                            dark: '#123766',
                        },
                        accent: {
                            yellow: '#f5b014',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        html, body {
            height: 100%;
            overflow-x: hidden;
        }
        body {
            background-color: #1e5395;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(245, 176, 20, 0.15) 0%, transparent 20%);
            background-attachment: fixed;
        }
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 8px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 antialiased pb-6 flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-navy-dark text-white border-b-4 border-accent-yellow shadow-md mb-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-accent-yellow text-navy-dark rounded-lg flex items-center justify-center w-9 h-9 shadow-sm text-lg">
                    <i class="fa-solid fa-microchip"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg md:text-xl tracking-wide uppercase leading-tight">
                        PROMPT LAB FISDAS <span class="text-accent-yellow">ITS</span>
                    </h1>
                    <p class="text-xs text-blue-200">Pusat Download Berkas & Modul Praktikum</p>
                </div>
            </div>

        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 w-full flex-1 flex flex-col">
        <!-- Card Container Utama -->
        <div class="bg-white rounded-2xl p-4 sm:p-6 shadow-2xl border border-slate-100 flex flex-col h-[calc(100vh-120px)]">
            
            <!-- Filter & Search Bar -->
            <div class="mb-4 space-y-3 shrink-0">
                <div class="flex flex-col sm:flex-row items-center justify-between gap-3 border-b border-slate-100 pb-4">
                    <div>
                        <h2 class="text-lg font-bold text-navy-dark flex items-center gap-2">
                            <span class="w-2 h-5 bg-accent-yellow rounded-full inline-block"></span>
                            Unduh File Lembar Kerja Praktikum (LKP)
                        </h2>
                        <p id="totalCounter" class="text-xs text-slate-500 mt-0.5">Memuat berkas...</p>
                    </div>
                    <!-- Input Search -->
                    <div class="relative w-full sm:w-72">
                        <input id="searchInput" type="text" placeholder="Cari nama LKP atau kelas..." 
                            class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-navy focus:border-transparent transition-all" 
                            oninput="filterFiles()" />
                        <svg class="w-4 h-4 text-slate-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Container Scroll untuk Data File -->
            <div id="fileList" class="space-y-3 overflow-y-auto pr-2 custom-scroll flex-1">
                <!-- Data dimasukkan secara otomatis oleh JavaScript -->
            </div>
        </div>
    </main>

    <script>
        // Array Daftar Seluruh File LKP Praktikum
        const dataFiles = [
            // Module 1
            {
                judul: "1. LKP REG - Alat Ukur Panjang",
                kategori: "PDF Document • Kelas Reguler",
                link: "files/1. LKP REG_Alat Ukur Panjang.pdf"
            },
            {
                judul: "1. LKP IUP - Length Measuring Instruments",
                kategori: "PDF Document • Kelas IUP",
                link: "files/1. LKP IUP_Length Measuring Instruments.pdf"
            },
            // Module 2
            {
                judul: "2. LKP REG - Tetapan Pegas",
                kategori: "PDF Document • Kelas Reguler",
                link: "files/2. LKP REG_Tetapan Pegas.pdf"
            },
            {
                judul: "2. LKP IUP - Spring Constant",
                kategori: "PDF Document • Kelas IUP",
                link: "files/2. LKP IUP_Spring Constant.pdf"
            },
            // Module 3
            {
                judul: "3. LKP REG - Bandul Matematis",
                kategori: "PDF Document • Kelas Reguler",
                link: "files/3. LKP REG_Bandul Matematis.pdf"
            },
            {
                judul: "3. LKP IUP - Mathematical Pendulum",
                kategori: "PDF Document • Kelas IUP",
                link: "files/3. LKP IUP_Mathematical Pendulum.pdf"
            },
            // Module 4
            {
                judul: "4. LKP REG - Bola Jatuh Bebas",
                kategori: "PDF Document • Kelas Reguler",
                link: "files/4. LKP REG_Bola Jatuh Bebas.pdf"
            },
            {
                judul: "4. LK IUP - Free Falling Object",
                kategori: "PDF Document • Kelas IUP",
                link: "files/4. LK IUP_Free Falling Object.pdf"
            },
            // Module 5
            {
                judul: "5. LKP REG - Fletcher's Trolley",
                kategori: "PDF Document • Kelas Reguler",
                link: "files/5. LKP REG_Fletcher's Trolley.pdf"
            },
            {
                judul: "5. LKP IUP - Fletcher's Trolley",
                kategori: "PDF Document • Kelas IUP",
                link: "files/5. LKP IUP_Fletcher's Trolley.pdf"
            },
            // Module 6
            {
                judul: "6. LKP REG - Momentum dan Tumbukan",
                kategori: "PDF Document • Kelas Reguler",
                link: "files/6. LKP REG_Momentum dan Tumbukan.pdf"
            },
            {
                judul: "6. LKP IUP - Momentum and Collisions",
                kategori: "PDF Document • Kelas IUP",
                link: "files/6. LKP IUP_Momentum and Collisions.pdf"
            },
            // Module 7
            {
                judul: "7. LKP REG - Bandul Fisis",
                kategori: "PDF Document • Kelas Reguler",
                link: "files/7. LKP REG_Bandul Fisis.pdf"
            },
            {
                judul: "7. LKP IUP - Physical Pendulum",
                kategori: "PDF Document • Kelas IUP",
                link: "files/7. LKP IUP_Physical Pendulum.pdf"
            },
            // Module 8
            {
                judul: "8. LKP REG - Gerak Peluru",
                kategori: "PDF Document • Kelas Reguler",
                link: "files/8. LKP REG_Gerak Peluru.pdf"
            },
            {
                judul: "8. LKP IUP - Projectile Motion",
                kategori: "PDF Document • Kelas IUP",
                link: "files/8. LKP IUP_Projectile Motion.pdf"
            },
            // Module 9
            {
                judul: "9. LKP REG - Viskositas Metode Bola Jatuh",
                kategori: "PDF Document • Kelas Reguler",
                link: "files/9. LKP REG_Viskositas Metode Bola Jatuh.pdf"
            },
            {
                judul: "9. LKP IUP - Viscosity by the Falling Sphere Method",
                kategori: "PDF Document • Kelas IUP",
                link: "files/9. LKP IUP_Viscosity by the Falling Sphere Method.pdf"
            },
            // Module 10
            {
                judul: "10. LKP REG - Momen Inersia Roda Berputar",
                kategori: "PDF Document • Kelas Reguler",
                link: "files/10. LKP REG_Momen Inersia Roda Berputar.pdf"
            },
            {
                judul: "10. LKP IUP - Moment of Inertia of a Rotating Wheel",
                kategori: "PDF Document • Kelas IUP",
                link: "files/10. LKP IUP_Moment of Inertia of a Rotating Wheel.pdf"
            },
            // Module 11
            {
                judul: "11. LKP REG - Momen Inersia Benda Tegar",
                kategori: "PDF Document • Kelas Reguler",
                link: "files/11. LKP REG_Momen Inersia Benda Tegar.pdf"
            },
            {
                judul: "11. LKP IUP - Moment of Inertia of a Rigid Object",
                kategori: "PDF Document • Kelas IUP",
                link: "files/11. LKP IUP_Moment of Inertia of a Rigid Object.pdf"
            },
            // Module 12
            {
                judul: "12. LKP REG - Koefisien Gesek",
                kategori: "PDF Document • Kelas Reguler",
                link: "files/12. LKP REG_Koefisien Gesek.pdf"
            },
            {
                judul: "12. LKP IUP - Coefficient of Friction",
                kategori: "PDF Document • Kelas IUP",
                link: "files/12. LKP IUP_Coefficient of Friction.pdf"
            },
            // Module 13
            {
                judul: "13. LKP REG - Viskositas Metode Ostwald",
                kategori: "PDF Document • Kelas Reguler",
                link: "files/13. LKP REG_Viskositas Metode Ostwald.pdf"
            },
            {
                judul: "13. LKP IUP - Ostwald Method Viscosity",
                kategori: "PDF Document • Kelas IUP",
                link: "files/13. LKP IUP_Ostwald Method Viscosity.pdf"
            },
            // Module 14
            {
                judul: "14. LKP REG - Tekanan Hidrostatis Tabung U",
                kategori: "PDF Document • Kelas Reguler",
                link: "files/14. LKP IUP_Tekanan Hidrostatis Tabung U.pdf"
            },
            {
                judul: "14. LKP IUP - U-Tube Hydrostatic Pressure",
                kategori: "PDF Document • Kelas IUP",
                link: "files/14. LKP IUP_U-Tube Hydrostatic Pressure.pdf"
            }
        ];

        // Fungsi Render List File
        function renderFiles(list) {
            const container = document.getElementById('fileList');
            const counter = document.getElementById('totalCounter');
            
            container.innerHTML = '';
            counter.innerText = `Menampilkan ${list.length} dari ${dataFiles.length} berkas LKP`;

            if (list.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-400 py-12 text-sm font-medium">Berkas LKP tidak ditemukan</div>`;
                return;
            }

            list.forEach(file => {
                const card = document.createElement('div');
                card.className = "bg-slate-50 hover:bg-slate-100/80 rounded-xl p-3.5 sm:p-4 flex justify-between items-center border border-slate-200/70 transition-all";
                card.innerHTML = `
                    <div class="flex items-center gap-3 pr-2">
                        <div class="text-2xl w-8 text-center shrink-0">
                            <i class="fa-solid fa-file-pdf text-red-500"></i>
                        </div>
                        <div>
                            <div class="font-bold text-slate-900 text-sm sm:text-base leading-snug">${file.judul}</div>
                            <div class="text-xs text-slate-500 font-medium mt-0.5">${file.kategori}</div>
                        </div>
                    </div>
                    <a href="${encodeURI(file.link)}" download target="_blank" class="bg-navy hover:bg-navy-dark text-white font-semibold px-3.5 py-2 rounded-xl text-xs sm:text-sm shadow-sm transition-colors flex items-center gap-2 shrink-0">
                        <i class="fa-solid fa-download"></i>
                        <span>Download</span>
                    </a>
                `;
                container.appendChild(card);
            });
        }

        // Fungsi Filter Pencarian
        function filterFiles() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = dataFiles.filter(item => 
                item.judul.toLowerCase().includes(query) || 
                item.kategori.toLowerCase().includes(query)
            );
            renderFiles(filtered);
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderFiles(dataFiles);
        });
    </script>
</body>
</html>
